name: Prepare PyPI release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish only after separate owner release approval and enabling the repository gate"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "For approved publishing only: existing vVERSION tag at the main workflow commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pypi-release-preparation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright
      - run: python -m pytest
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - run: python scripts/smoke_installed.py dist
      - name: Validate explicitly approved release identity
        if: ${{ inputs.publish }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          from packaging.version import Version
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = Version(metadata["version"])
          assert metadata["name"] == "ffa-toolkit"
          assert not version.is_devrelease and not version.is_prerelease, "A stable release version is required"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag must match package version"
          tagged = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{os.environ['RELEASE_TAG']}^{{commit}}"], text=True
          ).strip()
          assert tagged == os.environ["RELEASE_SHA"], "Tag must identify this exact main commit"
          PY
      - name: Preserve validated distributions for this run
        if: ${{ matrix.python == '3.14' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: ${{ inputs.publish && vars.PYPI_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/ffa-toolkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pypi-distributions
          path: dist
      - name: Publish validated distributions using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
